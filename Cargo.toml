[package]
name = "mgrs"
version = "0.4.2"
edition = "2021"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Bidirectional MGRS/lat-long coordinate conversion CLI with multi-format I/O: CSV, GeoJSON, KML, KMZ, GPX, WKT, TopoJSON, Shapefile, GeoPackage, FlatGeobuf"
license = "MIT"
repository = "https://github.com/h4x0r/mgrs"
keywords = ["mgrs", "coordinates", "gis", "geojson", "shapefile"]
categories = ["command-line-utilities"]

[lib]
name = "mgrs"
path = "src/lib.rs"

[[bin]]
name = "mgrs"
path = "src/main.rs"

[features]
default = ["shapefile-format", "geopackage", "flatgeobuf-format"]
shapefile-format = ["dep:shapefile"]
geopackage = ["dep:rusqlite"]
flatgeobuf-format = ["dep:flatgeobuf", "dep:geozero"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
regex = "1.10"
geoconvert = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.41"
indicatif = "0.18"
zip = "8.0"
shapefile = { version = "0.9", optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
flatgeobuf = { version = "6.0", optional = true }
geozero = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
