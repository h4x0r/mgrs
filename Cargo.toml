[package]
name = "mgrs"
version = "0.3.0"
edition = "2021"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Bidirectional MGRS/lat-long coordinate conversion CLI with CSV, GeoJSON, KML, and GPX output"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4n6h4x0r/mgrs"
keywords = ["mgrs", "coordinates", "gis", "conversion", "csv"]
categories = ["command-line-utilities"]

[lib]
name = "mgrs"
path = "src/lib.rs"

[[bin]]
name = "mgrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
regex = "1.10"
geoconvert = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
indicatif = "0.17"
